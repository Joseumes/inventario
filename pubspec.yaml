name: inventario_flutter
description: Sistema de inventario con escaneo de códigos (almacenamiento local)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  mobile_scanner: ^5.1.0
  barcode_widget: ^2.0.3
  qr_flutter: ^4.1.0
  uuid: ^4.2.1
  intl: ^0.19.0
  csv: ^5.1.1
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  image_picker: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true